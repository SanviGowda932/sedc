<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        body{
          display:flex;   
          background-image: url(https://livewell.com/wp-content/uploads/2023/10/why-cant-i-access-my-online-banking-1697093037.jpg);
          
          }
  
          .container {
              padding: 20px 30px;
              border-radius: 15px;
              text-align: center;
              box-shadow: 0 10px 50px black;
              width: 400px;
              backdrop-filter: blur(6px);
              background-color: rgba(0, 0, 0, 0.4);
              color: white;
          }
       </style>  
</head>
  <body>
    <div class="container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  </body>
</html>

<div id="atmitem" class="p-3">
    <p>Please Choose an Operation</p>
    <button type="button" class="btn btn-primary"onclick="checkBalance()">Check Balance</button>
    <button class="btn btn-outline-success" onclick="deposit()">Deposit</button>
    <button class="btn btn-outline-warning" onclick="withdraw()">Withdraw</button>
    <button class="btn btn-outline-danger" onclick="logout()">Logout</button>

    <div id="transaction-section" class="mt-3"></div>

    <script>
        let balance = 1000;

        function checkBalance() {
            alert(`Current balance is $${balance}`);
        }

        function deposit() {
            const amount = prompt("Enter the amount to deposit:");
            const numAmount = parseFloat(amount);
            if (!isNaN(numAmount) && numAmount > 0) {
                balance += numAmount;
                alert(`Deposited $${numAmount}. Current balance is $${balance}`);
            } else {
                alert("Invalid deposit amount.");
            }
        }

        function withdraw() {
            const amount = prompt("Enter the amount to withdraw:");
            const numAmount = parseFloat(amount);
            if (!isNaN(numAmount) && numAmount > 0) {
                if (numAmount <= balance) {
                    balance -= numAmount;
                    alert(`Withdrew $${numAmount}. Current balance is $${balance}`);
                } else {
                    alert("Insufficient balance.");
                }
            } else {
                alert("Invalid withdrawal amount.");
            }
        }

        function logout() {
            alert("You have been logged out.");
        
        }
    </script>
</div>
